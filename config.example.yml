# ============================================================================
#  Nuxt Community · 全局配置文件
# ============================================================================
#  这是项目的唯一配置入口。所有可调参数都集中在此，应用启动时加载并持久化。
#
#  热重载（Hot Reload）：
#    修改本文件并保存后，运行中的服务会自动检测变更并即时生效 —— 无需重启。
#    通过 PUT /api/config 由管理员编辑同样会写回本文件并触发热重载。
#    PUT 为 PATCH 语义：只发需要改的字段即可，未提供的字段保持原值不被清空。
#
#  标记说明：
#    [热]   = 改动即时生效（运行中自动重载 + 推送到所有在线客户端）
#    [重启] = 改动需要重启进程才能生效（监听端口 / 数据目录 / 密钥等底层项）
#
#  即便本文件缺失或某项格式错误，应用也会回退到内置默认值，绝不会崩溃。
# ============================================================================

# ── 服务器（网络监听）─────────────────────────────────────────────────────
server:
  host: 0.0.0.0          # [重启] 监听地址；0.0.0.0 = 所有网卡，127.0.0.1 = 仅本机
  devPort: 3000          # [重启] 开发模式端口（npm run dev）
  prodPort: 3000         # [重启] 生产模式端口（npm run start）

# ── 数据与安全 ────────────────────────────────────────────────────────────
data:
  dataDir: ""            # [重启] JSON 数据目录；空 = <项目根>/data
  authSecret: "nuxt-app-dev-secret-change-in-prod"  # [重启] HMAC 签名密钥（生产务必修改）
  cookieMaxAgeDays: 30   # [热]   登录 Cookie 有效期（天）

# ── 业务限额 ──────────────────────────────────────────────────────────────
limits:
  posts:
    pageSize: 20         # [热] 社区瀑布流每页条数
    titleMax: 100        # [热] 帖子标题最大字数
    contentMax: 5000     # [热] 帖子正文最大字数
    maxTags: 10          # [热] 单帖最多标签数
    tagMaxLen: 20        # [热] 单个标签最大长度
  uploads:
    maxMedia: 9          # [热] 单帖最多媒体文件数（图+视频）
    maxVideos: 4         # [热] 单帖最多视频数
    maxImageSizeMB: 8    # [热] 单张图片最大体积（MB）
    maxVideoSizeMB: 100  # [热] 单个视频最大体积（MB）
  comments:
    textMax: 2000        # [热] 评论最大字数

# ── 实时通信（WebSocket）──────────────────────────────────────────────────
realtime:
  heartbeatIntervalMs: 25000   # [热] 心跳间隔（毫秒）
  reconnectDelayMs: 3000       # [热] 断线重连延迟（毫秒）

# ── 功能开关 ──────────────────────────────────────────────────────────────
features:
  enableSignup: true       # [热] 允许新用户注册
  enableGuestBrowse: true  # [热] 允许游客浏览（false = 未登录跳转登录）

# ── WuKongIM 即时通讯 ────────────────────────────────────────────────────
# 启动 WuKongIM：cd docker/wukongim && docker compose up -d
wukongim:
  enabled: false                                     # [热] 是否启用 WuKongIM（群聊/实时通讯）
  wsURL: "ws://localhost:5200"                       # [热] 浏览器 easyjssdk 连接地址
  apiURL: "http://localhost:5001"                    # [热] 服务端调用 WuKongIM HTTP API 地址
  managerToken: ""                                   # [热] WuKongIM 管理者 token（开启 token-auth 时必填）

# ── 品牌外观 ──────────────────────────────────────────────────────────────
branding:
  siteTitle: "拾光 · 记录此刻,遇见同好"  # [热] 浏览器标签页标题
  brandName: "拾光"                     # [热] 导航栏品牌名称
  brandLogo: "/logo.svg"                # [热] 品牌图标路径
